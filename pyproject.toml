[project]
name = "mlops-reproducible-pipeline"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "kevin.lopez", email = "kevinlopez.ind@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "dvc[s3]>=3.67.1",
    "lightgbm>=4.7.0",
    "mlflow==3.17.2",
    "pandas>=3.0.6",
    "pandera>=0.34.1",
    "prefect>=3.9.0",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
    "scikit-learn>=1.9.1",
]

[tool.uv.build-backend]
module-name = "taxi"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]
